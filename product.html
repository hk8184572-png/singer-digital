<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Laptop 2024 - Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .product-detail-box {
            background-color: #1e1e1e;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 { color: #ffd500; }
        .price { font-size: 28px; font-weight: bold; margin-bottom: 20px; }
        .specs { text-align: left; margin: 20px auto; max-width: 400px; color: #aaa;}
        
        .back-btn, .buy-btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin: 10px;
        }

        .back-btn { background-color: #333; color: white; }
        .buy-btn { background-color: #ffd500; color: black; }
        
        .back-btn:hover { background-color: #555; }
        .buy-btn:hover { background-color: #e6c000; }
    </style>
</head>
<body>

    <div class="product-detail-box">
        <h1>Pro Laptop 2024</h1>
        <img src="https://images.unsplash.com/photo-1511385348-a52b4a160dc2?w=800&q=80" alt="Laptop Detailed Image">
        
        <div class="price">$1,299</div>
        <p>Yeh laptop coding aur gaming ke liye behtareen hai. Iski battery pura din chalti hai.</p>
        
        <ul class="specs">
            <li>Processor: Super Fast 8-Core</li>
            <li>RAM: 16GB High Speed</li>
            <li>Storage: 512GB SSD</li>
        </ul>

        <!-- Wapas jane ka button aur Kharidne ka button -->
        <a href="index.html" class="back-btn">⬅ Wapas Shop Par Jayein</a>
        <a href="#" class="buy-btn" onclick="alert('Mubarak ho! Laptop kharid liya gaya!')">Kharidein (Buy Now)</a>
    </div>

</body>
</html>
